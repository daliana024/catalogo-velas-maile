<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración | Velas Maile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="admin">

        <!-- LOGIN -->
        <section
            id="loginPanel"
            class="panel login-panel"
        >

            <h1>Velas Maile</h1>

            <p class="subtitulo">
                Administración del catálogo
            </p>

            <form id="loginForm">

                <label for="correo">
                    Correo
                </label>

                <input
                    type="email"
                    id="correo"
                    required
                    autocomplete="email"
                >


                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    required
                    autocomplete="current-password"
                >


                <button
                    type="submit"
                    class="boton-principal"
                >
                    Iniciar sesión
                </button>

                <p
                    id="mensajeLogin"
                    class="mensaje"
                ></p>

            </form>

        </section>


        <!-- ADMINISTRADOR -->
        <section
            id="adminPanel"
            class="panel oculto"
        >

            <div class="encabezado-admin">

                <div>
                    <h1>Velas Maile</h1>

                    <p>
                        Gestión del catálogo
                    </p>
                </div>

                <button
                    id="cerrarSesion"
                    class="boton-secundario"
                    type="button"
                >
                    Salir
                </button>

            </div>


            <form id="productoForm">

                <input
                    type="hidden"
                    id="productoId"
                >


                <!-- TÍTULO -->
                <label for="titulo">
                    Título del producto
                </label>

                <input
                    type="text"
                    id="titulo"
                    required
                    placeholder="Ej. Recuerdo de Primera Comunión"
                >


                <!-- PRECIO -->
                <label for="precio">
                    Precio por docena
                </label>

                <input
                    type="number"
                    id="precio"
                    min="0"
                    step="100"
                    required
                    placeholder="10000"
                >


                <!-- CATEGORÍAS -->
                <label>
                    Categorías
                </label>

                <p class="ayuda">
                    Puedes seleccionar varias.
                </p>

                <div
                    class="selector-opciones"
                    id="selectorCategorias"
                >

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Bautizos"
                    >
                        Bautizos
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Cabos de año"
                    >
                        Cabos de año
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Matrimonios"
                    >
                        Matrimonios
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Detalles especiales"
                    >
                        Detalles especiales
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Cumpleaños"
                    >
                        Cumpleaños
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Aromatizadas"
                    >
                        Aromatizadas
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Baby Shower"
                    >
                        Baby Shower
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Personalizadas"
                    >
                        Personalizadas
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Graduaciones"
                    >
                        Graduaciones
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Quinceañeras"
                    >
                        Quinceañeras
                    </button>

                    <button
                        type="button"
                        class="opcion-categoria"
                        data-valor="Hechas con amor"
                    >
                        Hechas con amor
                    </button>

                </div>


                <!-- EMPAQUE -->
                <label>
                    Empaque
                </label>

                <p class="ayuda">
                    Selecciona una opción.
                </p>

                <div
                    class="selector-opciones"
                    id="selectorEmpaque"
                >

                    <button
                        type="button"
                        class="opcion-empaque"
                        data-valor="Cajita blanca"
                    >
                        Cajita blanca
                    </button>

                    <button
                        type="button"
                        class="opcion-empaque"
                        data-valor="Cajita de acetato"
                    >
                        Cajita de acetato
                    </button>

                    <button
                        type="button"
                        class="opcion-empaque"
                        data-valor="Bolsita de organza"
                    >
                        Bolsita de organza
                    </button>

                </div>


                <!-- ORDEN -->
                <label for="orden">
                    Orden en el catálogo
                </label>

                <input
                    type="number"
                    id="orden"
                    value="0"
                    min="0"
                >


                <!-- FOTOS -->
                <label for="fotos">
                    Fotos de esta vela
                </label>

                <input
                    type="file"
                    id="fotos"
                    accept="image/png,image/jpeg,image/webp"
                    multiple
                >

                <p class="ayuda">
                    Selecciona varias fotos del mismo producto.
                </p>


                <div
                    id="previewFotos"
                    class="preview-fotos"
                ></div>


                <button
                    type="submit"
                    class="boton-principal"
                    id="guardarProducto"
                >
                    Publicar producto
                </button>


                <button
                    type="button"
                    class="boton-secundario cancelar oculto"
                    id="cancelarEdicion"
                >
                    Cancelar edición
                </button>


                <p
                    id="mensajeProducto"
                    class="mensaje"
                ></p>

            </form>


            <!-- PRODUCTOS EXISTENTES -->
            <section class="productos-admin">

                <h2>
                    Productos publicados
                </h2>

                <div id="listaProductos"></div>

            </section>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="admin.js"></script>

</body>

</html>
