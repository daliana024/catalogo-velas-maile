<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo Velas MAILE</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="app">

    <!-- PORTADA -->

    <section class="portada">

        <img
            src="imagenes/logo-maile.png"
            alt="Logo Velas MAILE"
            class="logo"
        >

        <p class="nuestro">
            NUESTRO
        </p>

        <h1 class="catalogo-titulo">
            CATÁLOGO
        </h1>

        <p class="velas-titulo">
            Velas
        </p>

        <div class="botones-redes">

            <a
                href="#"
                class="boton-red"
            >
                WhatsApp
            </a>

            <a
                href="#"
                class="boton-red"
            >
                Instagram
            </a>

        </div>

    </section>


    <!-- PUBLICACIONES -->

    <main class="catalogo">

        <button class="publicacion" onclick="abrirPublicacion(0)">
            <img src="imagenes/vela1.jpg" alt="Vela personalizada">
        </button>

        <button class="publicacion" onclick="abrirPublicacion(1)">
            <img src="imagenes/vela2.png" alt="Vela personalizada">
        </button>

        <button class="publicacion" onclick="abrirPublicacion(2)">
            <img src="imagenes/vela3.png" alt="Vela personalizada">
        </button>

        <button class="publicacion" onclick="abrirPublicacion(3)">
            <img src="imagenes/vela4.png" alt="Vela personalizada">
        </button>

        <button class="publicacion" onclick="abrirPublicacion(4)">
            <img src="imagenes/vela5.png" alt="Vela personalizada">
        </button>

        <button class="publicacion" onclick="abrirPublicacion(5)">
            <img src="imagenes/vela6.png" alt="Vela personalizada">
        </button>

    </main>

</div>


<!-- PUBLICACIÓN ABIERTA -->

<div id="modal" class="modal">

    <div class="modal-contenido">

        <div class="barra-superior">

            <button
                class="volver"
                onclick="cerrarPublicacion()"
            >
                ←
            </button>

            <span>Velas MAILE</span>

        </div>


        <div class="carrusel">

            <img
                id="imagenGrande"
                src=""
                alt="Producto"
            >

            <button
                class="flecha flecha-izquierda"
                onclick="fotoAnterior()"
            >
                ‹
            </button>

            <button
                class="flecha flecha-derecha"
                onclick="fotoSiguiente()"
            >
                ›
            </button>

        </div>


        <div
            id="indicadores"
            class="indicadores"
        ></div>


        <div class="informacion">

            <h2 id="tituloProducto"></h2>

            <p id="descripcionProducto"></p>

            <a
                id="botonWhatsapp"
                href="#"
                target="_blank"
                class="whatsapp"
            >
                Pedir por WhatsApp
            </a>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
