<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo Velas MAILE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="app">

        <!-- PORTADA -->

        <section class="portada">

            <div class="capa-portada">

                <img
                    src="imagenes/logo-maile.png"
                    alt="Logo Velas MAILE"
                    class="logo"
                >

                <p class="nuestro">
                    NUESTRO
                </p>

                <h1 class="catalogo-titulo">
                    CATÁLOGO
                </h1>

                <p class="velas-titulo">
                    Velas
                </p>

            </div>

        </section>


        <!-- BOTONES DE REDES -->

        <div class="botones-redes">

            <a
                href="https://wa.me/573008866132?text=Hola%2C%20vi%20su%20cat%C3%A1logo%20de%20Velas%20MAILE%20y%20quisiera%20m%C3%A1s%20informaci%C3%B3n."
                class="boton-red"
                target="_blank"
                rel="noopener noreferrer"
            >

                <svg
                    class="icono-red"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M12.04 2a9.84 9.84 0 0 0-8.4 14.97L2 22l5.2-1.61A9.9 9.9 0 1 0 12.04 2Zm0 17.97a8 8 0 0 1-4.08-1.12l-.29-.17-3.08.95.98-3-.19-.3a8 8 0 1 1 6.66 3.64Zm4.39-5.99c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.47-.39-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2 0 1.18.86 2.32.98 2.48.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.52.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z"
                    />
                </svg>

                <span>WhatsApp</span>

            </a>


            <a
                href="https://www.instagram.com/velasmaile/"
                class="boton-red"
                target="_blank"
                rel="noopener noreferrer"
            >

                <svg
                    class="icono-red"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.76 3.76 0 0 0 4 7.75v8.5A3.76 3.76 0 0 0 7.75 20h8.5A3.76 3.76 0 0 0 20 16.25v-8.5A3.76 3.76 0 0 0 16.25 4h-8.5Zm8.88 1.5a1.38 1.38 0 1 1 0 2.75 1.38 1.38 0 0 1 0-2.75ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
                    />
                </svg>

                <span>Instagram</span>

            </a>

        </div>


        <!-- CATÁLOGO -->

        <main class="catalogo">

            <button
                class="publicacion"
                onclick="abrirPublicacion(0)"
                aria-label="Abrir publicación 1"
            >
                <img
                    src="imagenes/vela1.jpg"
                    alt="Vela personalizada"
                >

                <span class="ver-detalle">
                    Toca para ver
                </span>
            </button>


            <button
                class="publicacion"
                onclick="abrirPublicacion(1)"
                aria-label="Abrir publicación 2"
            >
                <img
                    src="imagenes/vela2.png"
                    alt="Vela Baby Shower"
                >

                <span class="ver-detalle">
                    Toca para ver
                </span>
            </button>


            <button
                class="publicacion"
                onclick="abrirPublicacion(2)"
                aria-label="Abrir publicación 3"
            >
                <img
                    src="imagenes/vela3.png"
                    alt="Vela para bautizo"
                >

                <span class="ver-detalle">
                    Toca para ver
                </span>
            </button>


            <button
                class="publicacion"
                onclick="abrirPublicacion(3)"
                aria-label="Abrir publicación 4"
            >
                <img
                    src="imagenes/vela4.png"
                    alt="Vela personalizada"
                >

                <span class="ver-detalle">
                    Toca para ver
                </span>
            </button>


            <button
                class="publicacion"
                onclick="abrirPublicacion(4)"
                aria-label="Abrir publicación 5"
            >
                <img
                    src="imagenes/vela5.png"
                    alt="Recuerdo artesanal"
                >

                <span class="ver-detalle">
                    Toca para ver
                </span>
            </button>


            <button
                class="publicacion"
                onclick="abrirPublicacion(5)"
                aria-label="Abrir publicación 6"
            >
                <img
                    src="imagenes/vela6.png"
                    alt="Velas MAILE"
                >

                <span class="ver-detalle">
                    Toca para ver
                </span>
            </button>

        </main>

    </div>


    <!-- PUBLICACIÓN ABIERTA -->

    <div
        id="modal"
        class="modal"
    >

        <div class="modal-contenido">

            <div class="barra-superior">

                <button
                    class="volver"
                    onclick="cerrarPublicacion()"
                    aria-label="Volver al catálogo"
                >
                    ←
                </button>

                <span>
                    Velas MAILE
                </span>

            </div>


            <div
                class="carrusel"
                id="carrusel"
            >

                <img
                    id="imagenGrande"
                    src=""
                    alt="Producto"
                >

            </div>


            <div
                id="indicadores"
                class="indicadores"
            >
            </div>


            <div class="informacion">

                <h2 id="tituloProducto"></h2>

                <p
                    id="precioProducto"
                    class="precio-producto"
                ></p>

                <p id="descripcionProducto"></p>

                <a
                    id="botonWhatsapp"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="whatsapp"
                >
                    Pedir por WhatsApp
                </a>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
