<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Velas Maile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="app">
    <section class="portada">
        <div class="capa-portada">
            <img src="imagenes/logo-maile.png" alt="Velas Maile" class="logo">
            <p class="nuestro">NUESTRO</p>
            <h1 class="catalogo-titulo">CATÁLOGO</h1>
            <p class="velas-titulo">Velas</p>
        </div>
    </section>

    <div class="botones-redes">
        <a href="https://wa.me/573008866132" class="boton-red" target="_blank" rel="noopener noreferrer">
            <svg class="icono-red" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.84 11.84 0 0 0 12.08 0C5.52 0 .18 5.34.18 11.9c0 2.1.55 4.15 1.59 5.95L.08 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.56 0 11.9-5.34 11.9-11.9 0-3.18-1.22-6.17-3.45-8.42ZM12.07 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.64-.23-.37A9.88 9.88 0 0 1 2.18 11.9c0-5.46 4.44-9.9 9.9-9.9a9.82 9.82 0 0 1 7 2.9 9.83 9.83 0 0 1 2.9 7c0 5.46-4.45 9.9-9.91 9.9Zm5.43-7.42c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.48-1.75-1.65-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.5 0 1.47 1.07 2.9 1.22 3.1.15.2 2.1 3.2 5.08 4.49.71.3 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"></path></svg>
            <span>WhatsApp</span>
        </a>

        <a href="https://www.instagram.com/velasmaile/" class="boton-red" target="_blank" rel="noopener noreferrer">
            <svg class="icono-red" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.76 3.76 0 0 0 4 7.75v8.5A3.76 3.76 0 0 0 7.75 20h8.5A3.76 3.76 0 0 0 20 16.25v-8.5A3.76 3.76 0 0 0 16.25 4h-8.5Zm8.75 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"></path></svg>
            <span>Instagram</span>
        </a>
    </div>

    <main id="catalogo" class="catalogo">
        <div class="mensaje-catalogo">Cargando catálogo...</div>
    </main>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Detalle del producto">
    <div class="modal-contenido">
        <div class="barra-superior">
            <button class="volver" type="button" onclick="volverCatalogo()" aria-label="Volver al catálogo">←</button>
            <span>Velas Maile</span>
        </div>

        <div class="carrusel-wrapper">
            <div id="carrusel" class="carrusel">
                <img id="imagenGrande" src="" alt="">
            </div>
            <button class="flecha flecha-izquierda" type="button" onclick="fotoAnterior()" aria-label="Foto anterior">‹</button>
            <button class="flecha flecha-derecha" type="button" onclick="fotoSiguiente()" aria-label="Foto siguiente">›</button>
        </div>

        <div id="indicadores" class="indicadores"></div>

        <div class="informacion">
            <p class="submarca-modal">VELAS MAILE</p>
            <h2 id="tituloProducto"></h2>

            <div class="bloque-precio">
                <span class="texto-precio">PRECIO POR DOCENA</span>
                <p id="precioProducto" class="precio-producto"></p>
            </div>

            <div id="etiquetasProducto" class="etiquetas"></div>

            <div class="bloque-empaque">
                <span class="titulo-empaque">Empaque</span>
                <p id="empaqueProducto" class="empaque-producto"></p>
            </div>

            <a id="botonWhatsapp" class="whatsapp" href="#" target="_blank" rel="noopener noreferrer">Consultar por WhatsApp</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
