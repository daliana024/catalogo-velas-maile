<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Velas MAILE</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="app">

        <header class="perfil">

            <h1>Velas MAILE</h1>

            <p class="frase">
                Detalles hechos con amor
            </p>

            <div class="botones-perfil">

                <a href="#" class="boton">
                    WhatsApp
                </a>

                <a href="#" class="boton">
                    Instagram
                </a>

            </div>

        </header>


        <section class="categorias">

            <button>Baby Shower</button>

            <button>Bautizo</button>

            <button>Cumpleaños</button>

            <button>Religiosas</button>

        </section>


        <main class="catalogo">

            <button class="publicacion" onclick="abrirPublicacion(0)">
                <img src="imagenes/vela1.jpg" alt="Vela personalizada">
            </button>

            <button class="publicacion" onclick="abrirPublicacion(1)">
                <img src="imagenes/vela2.jpg" alt="Vela personalizada">
            </button>

            <button class="publicacion" onclick="abrirPublicacion(2)">
                <img src="imagenes/vela3.jpg" alt="Vela personalizada">
            </button>

            <button class="publicacion" onclick="abrirPublicacion(3)">
                <img src="imagenes/vela4.jpg" alt="Vela personalizada">
            </button>

            <button class="publicacion" onclick="abrirPublicacion(4)">
                <img src="imagenes/vela5.jpg" alt="Vela personalizada">
            </button>

            <button class="publicacion" onclick="abrirPublicacion(5)">
                <img src="imagenes/vela6.jpg" alt="Vela personalizada">
            </button>

        </main>

    </div>


    <div id="modal" class="modal">

        <div class="modal-contenido">

            <div class="barra-superior">

                <button class="volver" onclick="cerrarPublicacion()">
                    ←
                </button>

                <span>Velas MAILE</span>

            </div>


            <div class="carrusel">

                <img
                    id="imagenGrande"
                    src=""
                    alt="Producto"
                >

                <button
                    class="flecha flecha-izquierda"
                    onclick="fotoAnterior()"
                >
                    ‹
                </button>

                <button
                    class="flecha flecha-derecha"
                    onclick="fotoSiguiente()"
                >
                    ›
                </button>

            </div>


            <div id="indicadores" class="indicadores"></div>


            <div class="informacion">

                <h2 id="tituloProducto">
                </h2>

                <p id="descripcionProducto">
                </p>

                <a
                    id="botonWhatsapp"
                    href="#"
                    target="_blank"
                    class="whatsapp"
                >
                    Pedir por WhatsApp
                </a>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
